name: CD

# Push tag vX.Y.Z (hoặc chạy tay) -> Lint/Test/Build -> Docker image -> GHCR -> Deploy Render -> Smoke test.
# Rollback: chạy tay workflow này, nhập `image_tag` là tag ổn định trước đó (bỏ qua build, chỉ deploy lại).
#
# Cần cấu hình trong GitHub -> Settings -> Secrets and variables -> Actions:
#   Secrets:   RENDER_API_DEPLOY_HOOK, RENDER_WEB_DEPLOY_HOOK   (Deploy Hook URL của từng service trên Render)
#   Variables: PRODUCTION_API_URL (vd https://brewlite-api.onrender.com), PRODUCTION_WEB_URL
# Hai package GHCR (brewlite-api, brewlite-web) phải để Public để Render kéo image không cần credential.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Chỉ deploy lại image tag này (rollback). Để trống để build bản mới từ commit hiện tại."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  quality:
    name: quality
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        if: ${{ matrix.app == 'api' }}
        run: npx prisma generate --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build

  build:
    name: build-and-push (${{ matrix.app }})
    needs: quality
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Tag image = commit SHA ngắn (bất biến, dùng để rollback); thêm tag phiên bản nếu có.
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Tên nhánh có dấu / (vd fix/abc) không hợp lệ làm tag Docker -> đổi / thành -.
          echo "ref=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${owner}/brewlite-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PRODUCTION_API_URL }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.ref }}

  deploy:
    name: deploy-and-smoke-test
    needs: build
    # Chạy khi build thành công, hoặc khi rollback bằng input image_tag (build bị bỏ qua).
    if: ${{ always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.image_tag != '')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Xác định tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Kiểm tra cấu hình (dừng ngay nếu thiếu)
        env:
          API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          WEB_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
          API_URL: ${{ vars.PRODUCTION_API_URL }}
          WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
        run: |
          set -u
          fail=0
          for name in API_HOOK WEB_HOOK API_URL WEB_URL; do
            if [ -z "$(printf %s "${!name}" | tr -d '[:space:]')" ]; then
              echo "::error::Thiếu cấu hình ${name} (Settings -> Secrets and variables -> Actions)."
              fail=1
            fi
          done
          # URL không chứa bí mật nên in ra để thấy ký tự thừa (khoảng trắng, xuống dòng).
          echo "PRODUCTION_API_URL = [$(printf %s "$API_URL" | tr -d '\r\n')] (${#API_URL} ký tự)"
          echo "PRODUCTION_WEB_URL = [$(printf %s "$WEB_URL" | tr -d '\r\n')] (${#WEB_URL} ký tự)"
          exit $fail
      - name: Deploy api và web lên Render
        env:
          API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          WEB_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="${{ steps.tag.outputs.value }}"
          for app in api web; do
            hook_var="${app^^}_HOOK"
            img="${REGISTRY}/${owner}/brewlite-${app}:${tag}"
            enc=$(printf %s "$img" | jq -sRr @uri)
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "${!hook_var}&imgURL=${enc}")
            echo "deploy ${app} -> ${img}: HTTP ${code}"
            if [ "$code" != "200" ] && [ "$code" != "202" ]; then
              echo "::error::Deploy ${app} thất bại (HTTP ${code}). Pipeline dừng, bản đang chạy giữ nguyên."
              exit 1
            fi
          done
      - name: Smoke test
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
          WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
        run: |
          set -euo pipefail
          # Bỏ khoảng trắng/xuống dòng thừa và dấu / cuối trong URL.
          API_URL="$(printf %s "$API_URL" | tr -d '[:space:]')"; API_URL="${API_URL%/}"
          WEB_URL="$(printf %s "$WEB_URL" | tr -d '[:space:]')"; WEB_URL="${WEB_URL%/}"
          echo "Smoke test: API=${API_URL} WEB=${WEB_URL}"
          # Render gói miễn phí có thể mất khoảng 1-3 phút để chạy bản mới / khởi động lại.
          for i in $(seq 1 30); do
            if curl -fsS "${API_URL}/health" | grep -q '"status":"ok"'; then ok=1; break; fi
            echo "Chờ API sẵn sàng (${i}/30)..."; sleep 10
          done
          [ "${ok:-0}" = "1" ] || { echo "::error::API /health không phản hồi sau khi deploy"; exit 1; }
          curl -fsS "${API_URL}/products" | grep -q '"name"' || { echo "::error::GET /products không trả dữ liệu"; exit 1; }
          curl -fsS -o /dev/null -w "web: HTTP %{http_code}\n" "${WEB_URL}/menu"
          echo "Smoke test đạt."
      - name: Hướng dẫn rollback khi lỗi
        if: ${{ failure() }}
        run: |
          echo "::warning::Deploy hoặc smoke test lỗi. Rollback: Actions -> CD -> Run workflow -> nhập image_tag là tag ổn định trước đó (xem docs/deployment.md mục 5)."
