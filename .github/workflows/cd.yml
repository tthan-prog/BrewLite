name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Rollback: tag image ổn định, ví dụ sha-abcdef1. Để trống để build bản mới."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  quality:
    name: quality
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        if: ${{ matrix.app == 'api' }}
        run: npx prisma generate --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build

  build:
    name: build-and-push (${{ matrix.app }})
    needs: quality
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "ref=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${owner}/brewlite-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PRODUCTION_API_URL }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.ref }}

  deploy:
    name: deploy-and-smoke-test
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.image_tag != '')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Xác định tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            value="${{ inputs.image_tag }}"
          else
            value="sha-${GITHUB_SHA::7}"
          fi
          if [[ ! "$value" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::image_tag không hợp lệ."
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Kiểm tra cấu hình
        env:
          API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          WEB_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
          API_URL: ${{ vars.PRODUCTION_API_URL }}
          WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
        shell: bash
        run: |
          set -u
          fail=0
          for name in API_HOOK WEB_HOOK API_URL WEB_URL; do
            if [ -z "$(printf %s "${!name}" | tr -d '[:space:]')" ]; then
              echo "::error::Thiếu cấu hình ${name} trong GitHub Actions."
              fail=1
            fi
          done
          echo "PRODUCTION_API_URL = [$(printf %s "$API_URL" | tr -d '\r\n')]"
          echo "PRODUCTION_WEB_URL = [$(printf %s "$WEB_URL" | tr -d '\r\n')]"
          exit "$fail"
      - name: Deploy api và web lên Render
        env:
          API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          WEB_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          tag="${{ steps.tag.outputs.value }}"
          for app in api web; do
            if [ "$app" = "api" ]; then hook="$API_HOOK"; else hook="$WEB_HOOK"; fi
            img="${REGISTRY}/${owner}/brewlite-${app}:${tag}"
            enc=$(jq -rn --arg value "$img" '$value | @uri')
            separator='?'
            [[ "$hook" == *'?'* ]] && separator='&'
            url="${hook}${separator}imgURL=${enc}"
            code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST "$url")
            echo "deploy ${app}: HTTP ${code}"
            if [ "$code" != "200" ] && [ "$code" != "202" ]; then
              echo "::error::Deploy ${app} thất bại (HTTP ${code})."
              exit 1
            fi
          done
      - name: Smoke test
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
          WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          API_URL="$(printf %s "$API_URL" | tr -d '[:space:]')"
          WEB_URL="$(printf %s "$WEB_URL" | tr -d '[:space:]')"
          API_URL="${API_URL%/}"
          WEB_URL="${WEB_URL%/}"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS "${API_URL}/health" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              ok=1
              break
            fi
            echo "Chờ API sẵn sàng (${i}/30)..."
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "::error::API /health không trả trạng thái ok sau tối đa 5 phút."; exit 1; }
          curl -fsS "${API_URL}/products" | grep -q '"name"' || {
            echo "::error::GET /products không trả nội dung mong đợi."
            exit 1
          }
          curl -fsS "${WEB_URL}/menu" -o /dev/null
          echo "Smoke test đạt."
      - name: Hướng dẫn rollback khi lỗi
        if: failure()
        run: |
          echo "::warning::Rollback: Actions -> CD -> Run workflow -> nhập image_tag là tag ổn định trước đó (xem docs/deployment.md mục 5)."
