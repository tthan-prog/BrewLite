name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api:
    name: api
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api-e2e:
    name: api-e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brewlite -d brewlite"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite
      JWT_SECRET: ci-only-secret
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate --config prisma7.config.ts
      - name: Migrate and seed
        run: |
          npx prisma migrate deploy --config prisma7.config.ts
          npx prisma db seed --config prisma7.config.ts
      - run: npm run test:e2e

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build

  e2e-browser:
    name: e2e-browser
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brewlite -d brewlite"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite
      JWT_SECRET: ci-only-secret
      FRONTEND_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and start API
        working-directory: apps/api
        run: |
          npm ci
          npx prisma generate --config prisma7.config.ts
          npx prisma migrate deploy --config prisma7.config.ts
          npx prisma db seed --config prisma7.config.ts
          npm run build
          nohup node dist/main.js > /tmp/api.log 2>&1 &
          npx --yes wait-on -t 60000 http://localhost:3001/products
      - name: Build and start web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > /tmp/web.log 2>&1 &
          npx --yes wait-on -t 60000 http://localhost:3000
      - name: Playwright
        working-directory: tests/e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
